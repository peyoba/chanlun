[project]
name = "chanlun"
version = "0.1.0"
description = "缠论分析工具：A 股 / 港股多级别笔、线段、中枢、买卖点计算与绘图"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "baostock>=0.8.9",
  "akshare>=1.14",
  "yfinance>=0.2.40",
  "plotly>=5.22",
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
chan = "chanlun.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chanlun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
